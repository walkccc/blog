<!doctype html>
<html lang="{{ or site.Language.Lang "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <script>
      // Resolve theme before first paint to avoid a flash of the wrong scheme.
      (function () {
        try {
          var d = document.documentElement;
          var saved = localStorage.getItem("theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var t = saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light";
          d.classList.add(t);
          d.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    {{ partial "header.html" . }}
    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script>
      (function () {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var d = document.documentElement;
          var t = d.classList.contains("dark") ? "light" : "dark";
          d.classList.remove("light", "dark");
          d.classList.add(t);
          d.style.colorScheme = t;
          try {
            localStorage.setItem("theme", t);
          } catch (e) {}
        });
      })();
    </script>
    {{- if .Store.Get "hasMermaid" }}
    <script type="module">
      // Mermaid renders each diagram once, but every colour it draws with is
      // overridden in main.css with a CSS variable — so the theme toggle
      // restyles the diagrams instantly, with nothing to re-render.
      const root = document.documentElement;
      root.classList.add("mermaid-loading");
      try {
        const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs");
        // Read the stack off the page rather than repeating it here: mermaid
        // measures a label box in the font it was configured with, so the font
        // it measures in has to be the one main.css renders in.
        const font = getComputedStyle(root).getPropertyValue("--font-mono").replace(/\s+/g, " ").trim();
        mermaid.initialize({
          startOnLoad: false,
          theme: "base",
          securityLevel: "strict",
          flowchart: { curve: "linear", useMaxWidth: true, padding: 12 },
          themeVariables: { fontFamily: font, fontSize: "13px" },
        });
        await mermaid.run({ querySelector: "pre.mermaid" });
      } catch (e) {
        // CDN blocked, or a diagram that won't parse. Falling through to the
        // `finally` leaves the source on the page — which still reads as a
        // diagram — rather than leaving a hole where one should be.
      } finally {
        root.classList.remove("mermaid-loading");
      }
    </script>
    {{- end }}
  </body>
</html>
